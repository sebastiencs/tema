[package]
name = "tema"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
bincode = "1.3"
bitflags = "2.3"
derive_more = { version = "0.99.17", default-features = false, features = ["into", "from", "deref", "deref_mut"] }
heck = "0.4.1"
input = { version = "0.9", features = ["log"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1.1"
thiserror = "1.0"
toml = { version = "0.8", default-features = false, features = ["parse"] }
udev = "0.8"
xkbcommon = { version = "0.7", default-features = false }

# TODO: Put some of them in dev dependencies
itertools = "0.12"
wayland-scanner = { git = "https://github.com/sebastiencs/wayland-rs.git", branch = "my_wayland" }
nix = { version = "0.31", features = ["time", "fs", "user", "ioctl", "signal", "socket", "process", "uio", "poll"] }
owo-colors = "4"
dbus-message-parser = "4"
drm = { git = "https://github.com/sebastiencs/drm-rs.git", branch = "my_wayland" }
drm-ffi = "0.7.1"
edid-rs = { git = "https://gitlab.com/sebastiencs/edid-rs.git" }
khronos-types = { git = "https://github.com/sebastiencs/khronos-types.git" }
once_cell = "1.19.0"
drm-fourcc = { version = "2.2.0", features = ["build_bindings"] }
xcursor = "0.3.10"
inotify = { version = "0.11.1", default-features = false }
ash = "0.38"
gpu-alloc = "0.6"
gpu-alloc-ash = "0.7"

[build-dependencies]
# Loads the installed libshaderc_shared. The shaderc crate needs development
# headers this machine does not ship, so compilation goes through shaderc-dyn.
shaderc-dyn = "0.10"

[dev-dependencies]
mktemp = "0.5.0"
quick-xml = "0.39"

[target.'cfg(loom)'.dependencies]
loom = "0.5"

[profile.dev]
panic = "abort"

[profile.release]
debug = true
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
